<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Birthday Baby 🎂</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    overflow:hidden;
    font-family:Arial, sans-serif;
    background:
        radial-gradient(circle at top,#451477,#17052f 45%,#05010d);
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
}

/* Stars */
.star{
    position:absolute;
    width:3px;
    height:3px;
    background:white;
    border-radius:50%;
    animation:twinkle 2s infinite alternate;
}

@keyframes twinkle{
    from{
        opacity:.2;
        transform:scale(.5);
    }
    to{
        opacity:1;
        transform:scale(1.5);
    }
}

/* Birthday Card */
.card{
    position:relative;
    width:90%;
    max-width:600px;
    padding:50px 25px;
    text-align:center;
    border-radius:30px;

    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.2);

    backdrop-filter:blur(15px);

    box-shadow:
        0 0 40px rgba(255,0,180,.25),
        inset 0 0 30px rgba(255,255,255,.04);

    z-index:5;

    animation:cardIn 1.5s ease;
}

@keyframes cardIn{
    from{
        opacity:0;
        transform:scale(.7) translateY(50px);
    }
    to{
        opacity:1;
        transform:scale(1) translateY(0);
    }
}

/* Small Text */
.small{
    font-size:16px;
    letter-spacing:4px;
    color:#ffd6f7;
}

/* Main Title */
h1{
    margin:15px 0;

    font-size:clamp(42px,10vw,75px);

    line-height:1;

    background:
        linear-gradient(
            90deg,
            #ff4ecd,
            #ffffff,
            #ffd45c,
            #ff4ecd
        );

    background-size:300%;

    -webkit-background-clip:text;
    background-clip:text;

    color:transparent;

    animation:shine 4s linear infinite;
}

@keyframes shine{
    to{
        background-position:300%;
    }
}

/* Name */
.name{
    font-size:clamp(26px,7vw,46px);
    font-weight:bold;

    color:#fff;

    text-shadow:
        0 0 10px #ff4ecd,
        0 0 30px #ff4ecd;

    animation:pulse 2s infinite;
}

@keyframes pulse{
    50%{
        transform:scale(1.04);

        text-shadow:
            0 0 20px #ff4ecd,
            0 0 50px #ff4ecd;
    }
}

/* Message */
.message{
    margin-top:20px;

    font-size:17px;
    line-height:1.8;

    color:#eee;
}

/* Cake */
.cake{
    position:relative;

    width:150px;
    height:90px;

    margin:45px auto 20px;
}

.cake-body{
    position:absolute;

    bottom:0;

    width:150px;
    height:65px;

    border-radius:12px;

    background:
        linear-gradient(
            #ff72c6,
            #d92d91
        );

    box-shadow:
        0 10px 30px rgba(255,0,150,.4);
}

.cream{
    position:absolute;

    top:15px;

    width:150px;
    height:25px;

    border-radius:50%;

    background:#fff;
}

.candle{
    position:absolute;

    width:10px;
    height:45px;

    background:#ffd45c;

    left:70px;
    top:-25px;

    border-radius:5px;
}

.flame{
    position:absolute;

    width:18px;
    height:25px;

    background:#ffb300;

    border-radius:50%;

    top:-48px;
    left:-4px;

    box-shadow:
        0 0 20px #ff9d00;

    animation:flame .7s infinite alternate;
}

@keyframes flame{
    from{
        transform:scale(.8) rotate(-5deg);
    }

    to{
        transform:scale(1.1) rotate(5deg);
    }
}

/* Button */
button{
    margin-top:20px;

    padding:13px 28px;

    border:none;
    border-radius:50px;

    font-size:16px;
    font-weight:bold;

    color:#fff;

    cursor:pointer;

    background:
        linear-gradient(
            45deg,
            #ff2da6,
            #8e44ff
        );

    box-shadow:
        0 0 25px rgba(255,45,166,.5);

    transition:.3s;
}

button:hover{
    transform:scale(1.08);

    box-shadow:
        0 0 40px rgba(255,45,166,.8);
}

/* Balloons */
.balloon{
    position:absolute;

    width:55px;
    height:70px;

    border-radius:50%;

    bottom:-100px;

    animation:floatUp linear infinite;

    opacity:.9;
}

.balloon:after{
    content:"";

    position:absolute;

    width:2px;
    height:90px;

    background:rgba(255,255,255,.5);

    top:68px;
    left:50%;
}

@keyframes floatUp{
    from{
        transform:
            translateY(0)
            rotate(-8deg);
    }

    to{
        transform:
            translateY(-120vh)
            rotate(8deg);
    }
}

/* Confetti */
.confetti{
    position:absolute;

    width:8px;
    height:15px;

    top:-20px;

    animation:fall linear infinite;
}

@keyframes fall{
    to{
        transform:
            translateY(110vh)
            rotate(720deg);
    }
}

/* Footer */
.footer{
    margin-top:25px;

    font-size:12px;

    color:#aaa;
}
</style>
</head>

<body>

<!-- Stars -->
<script>

for(let i=0;i<80;i++){

    const star=document.createElement("div");

    star.className="star";

    star.style.left=
        Math.random()*100+"%";

    star.style.top=
        Math.random()*100+"%";

    star.style.animationDelay=
        Math.random()*2+"s";

    document.body.appendChild(star);
}

</script>


<!-- Balloons -->
<script>

const balloonColors=[
    "#ff4ecd",
    "#6c5ce7",
    "#00cec9",
    "#fdcb6e",
    "#ff7675"
];

for(let i=0;i<15;i++){

    const balloon=
        document.createElement("div");

    balloon.className="balloon";

    balloon.style.left=
        Math.random()*100+"%";

    balloon.style.background=
        balloonColors[
            Math.floor(
                Math.random()*balloonColors.length
            )
        ];

    balloon.style.animationDuration=
        (7+Math.random()*7)+"s";

    balloon.style.animationDelay=
        Math.random()*7+"s";

    document.body.appendChild(balloon);
}

</script>


<!-- Confetti -->
<script>

const confettiColors=[
    "#ff4ecd",
    "#ffd45c",
    "#00e5ff",
    "#ffffff",
    "#7cff6b"
];

for(let i=0;i<80;i++){

    const c=
        document.createElement("div");

    c.className="confetti";

    c.style.left=
        Math.random()*100+"%";

    c.style.background=
        confettiColors[
            Math.floor(
                Math.random()*confettiColors.length
            )
        ];

    c.style.animationDuration=
        (3+Math.random()*5)+"s";

    c.style.animationDelay=
        Math.random()*5+"s";

    document.body.appendChild(c);
}

</script>


<!-- Birthday Card -->
<div class="card">

    <div class="small">
        🎉 TODAY IS YOUR SPECIAL DAY 🎉
    </div>


    <h1>
        Happy Birthday
    </h1>


    <!-- Birthday Name -->
    <div class="name">
        🎈 Happy Birthday Baby 🎈
    </div>


    <!-- Cake -->
    <div class="cake">

        <div class="cake-body"></div>

        <div class="cream"></div>

        <div class="candle">

            <div class="flame"></div>

        </div>

    </div>


    <!-- Message -->
    <div class="message">

        May your birthday be filled with
        <b>love, happiness & beautiful memories.</b>

        <br>

        Wishing you an amazing year ahead! 💖✨

    </div>


    <!-- Button -->
    <button onclick="celebrate()">

        🎁 Make a Wish

    </button>


    <div class="footer">

        Made with ❤️ just for you

    </div>

</div>


<script>

function celebrate(){

    /* Confetti Explosion */

    for(let i=0;i<80;i++){

        const c=
            document.createElement("div");

        c.style.position="fixed";

        c.style.width="8px";

        c.style.height="14px";

        c.style.background=
            `hsl(${Math.random()*360},100%,70%)`;

        c.style.left="50%";

        c.style.top="50%";

        c.style.zIndex="100";

        document.body.appendChild(c);


        const angle=
            Math.random()*Math.PI*2;

        const distance=
            150+Math.random()*400;

        const x=
            Math.cos(angle)*distance;

        const y=
            Math.sin(angle)*distance;


        c.animate(

            [
                {
                    transform:
                        "translate(0,0) rotate(0deg)",
                    opacity:1
                },

                {
                    transform:
                        `translate(${x}px,${y}px) rotate(720deg)`,
                    opacity:0
                }
            ],

            {
                duration:
                    1200+Math.random()*800,

                easing:
                    "cubic-bezier(.2,.8,.3,1)"
            }

        );


        setTimeout(
            ()=>{
                c.remove();
            },
            2200
        );

    }


    alert(
        "🎂 Happy Birthday Baby! 🎉💖 Make a wish!"
    );

}

</script>

</body>
</html>
